<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>الموقع قيد الصيانة</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="page-container maintenance-bg">
    <!-- Background pattern -->
    <div class="bg-pattern"></div>

    <div class="content-wrapper">
      <!-- Wrench/Settings Icon -->
      <div class="icon-container">
        <div class="icon-circle icon-circle-amber">
          <!-- Settings/Wrench SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          <!-- Pulse ring -->
          <div class="pulse-ring pulse-ring-amber"></div>
        </div>
      </div>

      <!-- Title -->
      <h1 class="page-title">الموقع قيد الصيانة</h1>

      <!-- Description -->
      <p class="page-desc">
        نقوم حالياً بتحديث الموقع لتحسين تجربتكم.
        سنعود خلال لحظات<span class="dots"></span>
      </p>

      <!-- Progress bar -->
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>

      <!-- Info Card -->
      <div class="info-card">
        <div class="info-row">
          <!-- Clock SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <div>
            <h3>متى سيعود الموقع؟</h3>
            <p>عادةً ما تستغرق عملية الصيانة بضع دقائق فقط. سيعود الموقع للعمل تلقائياً فور اكتمال التحديث.</p>
          </div>
        </div>

        <div class="info-row">
          <!-- Info SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <div>
            <h3>هل بياناتي آمنة؟</h3>
            <p>نعم، جميع بياناتك وطلباتك محفوظة بأمان. لا تتأثر أي معاملات بعملية الصيانة.</p>
          </div>
        </div>
      </div>

      <!-- Auto-retry -->
      <div class="retry-section">
        <button id="retryBtn" class="btn-retry" onclick="handleRetry()">
          <!-- RefreshCw SVG -->
          <svg id="retryIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
          <span id="retryText">حاول مرة أخرى</span>
        </button>

        <p id="countdownText" class="countdown-text"></p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Maintenance Page Logic — Auto-retry every 15 seconds
    // ============================================================
    const ORIGIN = (() => {
      const params = new URLSearchParams(window.location.search);
      return params.get('origin') || 'https://matein3store.com';
    })();

    let countdown = 15;
    let retrying = false;
    let countdownTimer = null;

    startCountdown();

    function startCountdown() {
      clearInterval(countdownTimer);
      updateCountdownDisplay();
      countdownTimer = setInterval(() => {
        countdown--;
        updateCountdownDisplay();
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          handleRetry();
        }
      }, 1000);
    }

    function updateCountdownDisplay() {
      const el = document.getElementById('countdownText');
      if (countdown > 0 && !retrying) {
        el.textContent = 'محاولة تلقائية بعد ' + countdown + ' ثانية';
      } else {
        el.textContent = '';
      }
    }

    async function handleRetry() {
      if (retrying) return;
      retrying = true;
      clearInterval(countdownTimer);

      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const text = document.getElementById('retryText');

      btn.disabled = true;
      icon.classList.add('spin');
      text.textContent = 'جاري التحقق...';
      document.getElementById('countdownText').textContent = '';

      try {
        const res = await fetch(ORIGIN, {
          method: 'HEAD',
          mode: 'no-cors',
          cache: 'no-store',
        });
        // If server is back, redirect
        window.location.href = ORIGIN;
        return;
      } catch (e) {
        // Server still down
      }

      retrying = false;
      btn.disabled = false;
      icon.classList.remove('spin');
      text.textContent = 'حاول مرة أخرى';
      countdown = 15;
      startCountdown();
    }
  </script>
</body>
</html>
