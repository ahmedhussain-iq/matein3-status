<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>الموقع قيد التحديث — متجر الجبل المتين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Reset & Base
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.6;
      direction: rtl;
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #ffffff;
      color: #1a1a2e;
    }

    /* ============================================================
       Full-screen Layout
       ============================================================ */
    .page {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-y: auto;
    }

    /* ============================================================
       Background — Large watermark logo
       ============================================================ */
    .bg-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .bg-watermark svg {
      width: min(90vw, 90vh);
      height: min(90vw, 90vh);
      opacity: 0.04;
    }

    /* Subtle gradient overlay */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(255,255,255,0.6) 70%, rgba(255,255,255,0.95) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       Content
       ============================================================ */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ============================================================
       Logo
       ============================================================ */
    .logo-container {
      margin-bottom: 2rem;
    }

    .logo-container svg {
      width: 140px;
      height: auto;
    }

    /* ============================================================
       Gear Icon Animation
       ============================================================ */
    .gear-container {
      margin-bottom: 1.75rem;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .gear-outer {
      position: absolute;
      inset: 0;
      animation: gear-spin 8s linear infinite;
    }

    .gear-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      animation: gear-spin-reverse 6s linear infinite;
    }

    .gear-outer svg, .gear-inner svg {
      width: 100%;
      height: 100%;
    }

    @keyframes gear-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes gear-spin-reverse {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* ============================================================
       Typography
       ============================================================ */
    .title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.05rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.8;
      max-width: 360px;
    }

    /* ============================================================
       Progress Bar
       ============================================================ */
    .progress-wrapper {
      width: 100%;
      max-width: 280px;
      margin-bottom: 2.5rem;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #F5A623, #f7c15e);
      border-radius: 4px;
      animation: progress-move 2.5s ease-in-out infinite;
    }

    @keyframes progress-move {
      0% { transform: translateX(-150%); width: 40%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 40%; }
    }

    /* ============================================================
       Info Cards
       ============================================================ */
    .info-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .info-card {
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      padding: 1rem 1.25rem;
      background: #f8f9fb;
      border: 1px solid #e8eaef;
      border-radius: 12px;
      text-align: right;
      transition: all 0.3s ease;
    }

    .info-card:hover {
      background: #f1f3f7;
      border-color: #d5d9e2;
    }

    .info-card-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .info-card-icon.gold {
      background: rgba(245, 166, 35, 0.12);
    }

    .info-card-icon.blue {
      background: rgba(59, 130, 246, 0.1);
    }

    .info-card-icon svg {
      width: 18px;
      height: 18px;
    }

    .info-card-text h3 {
      font-size: 0.875rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }

    .info-card-text p {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.7;
    }

    /* ============================================================
       Retry Button
       ============================================================ */
    .retry-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: #ffffff;
      background: linear-gradient(135deg, #F5A623 0%, #e8951a 100%);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(245, 166, 35, 0.3);
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 166, 35, 0.4);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .btn-retry:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-retry svg {
      width: 16px;
      height: 16px;
    }

    .countdown {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* ============================================================
       Footer
       ============================================================ */
    .footer {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }

    .footer p {
      font-size: 0.7rem;
      color: #c0c7d4;
      font-weight: 400;
    }

    /* ============================================================
       Spinning animation
       ============================================================ */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 1s linear infinite; }

    /* ============================================================
       Responsive — Tablet
       ============================================================ */
    @media (min-width: 640px) {
      .title { font-size: 2rem; }
      .subtitle { font-size: 1.15rem; }
      .logo-container svg { width: 170px; }
      .gear-container { width: 90px; height: 90px; }
      .gear-inner { width: 45px; height: 45px; }
      .progress-wrapper { max-width: 320px; }
      .info-cards { flex-direction: row; gap: 1rem; }
      .info-card { flex: 1; flex-direction: column; align-items: center; text-align: center; padding: 1.25rem; }
      .info-card-icon { margin-top: 0; margin-bottom: 0.5rem; }
    }

    /* ============================================================
       Responsive — Large Desktop
       ============================================================ */
    @media (min-width: 1024px) {
      .title { font-size: 2.25rem; }
      .content { max-width: 560px; }
    }

    /* ============================================================
       Responsive — Small Mobile
       ============================================================ */
    @media (max-width: 380px) {
      .title { font-size: 1.4rem; }
      .subtitle { font-size: 0.95rem; }
      .logo-container svg { width: 110px; }
      .gear-container { width: 64px; height: 64px; }
      .gear-inner { width: 32px; height: 32px; }
      .info-card { padding: 0.875rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Background watermark — Matein3 logo large -->
    <div class="bg-watermark">
      <svg viewBox="0 0 512 512" fill="#F5A623" xmlns="http://www.w3.org/2000/svg">
        <path d="M256 32C132.3 32 32 132.3 32 256s100.3 224 224 224 224-100.3 224-224S379.7 32 256 32zm0 400c-97.2 0-176-78.8-176-176S158.8 80 256 80s176 78.8 176 176-78.8 176-176 176z"/>
        <path d="M352 176l-48-48-80 80-48-48-48 48 96 96z"/>
        <path d="M256 128c-70.7 0-128 57.3-128 128s57.3 128 128 128 128-57.3 128-128-57.3-128-128-128zm0 208c-44.2 0-80-35.8-80-80s35.8-80 80-80 80 35.8 80 80-35.8 80-80 80z"/>
      </svg>
    </div>
    <div class="bg-gradient"></div>

    <!-- Main Content -->
    <div class="content">
      <!-- Animated Gears -->
      <div class="gear-container">
        <div class="gear-outer">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 20a30 30 0 1 1 0 60 30 30 0 0 1 0-60zm0 10a20 20 0 1 0 0 40 20 20 0 0 0 0-40z" fill="#F5A623" opacity="0.2"/>
            <path d="M47 4h6v12h-6zM47 84h6v12h-6zM4 47h12v6H4zM84 47h12v6H84zM16.9 16.9l4.2 4.2-8.5 8.5-4.2-4.2zM83.3 70.4l4.2 4.2-8.5 8.5-4.2-4.2zM16.9 83.1l8.5-8.5 4.2 4.2-8.5 8.5zM70.4 16.7l8.5-8.5 4.2 4.2-8.5 8.5z" fill="#F5A623" opacity="0.35"/>
          </svg>
        </div>
        <div class="gear-inner">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 25a25 25 0 1 1 0 50 25 25 0 0 1 0-50zm0 10a15 15 0 1 0 0 30 15 15 0 0 0 0-30z" fill="#e8951a" opacity="0.3"/>
            <path d="M47 2h6v14h-6zM47 84h6v14h-6zM2 47h14v6H2zM84 47h14v6H84z" fill="#e8951a" opacity="0.4"/>
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h1 class="title">الموقع قيد التحديث</h1>

      <!-- Subtitle -->
      <p class="subtitle">
        نعمل على تحسين تجربتكم، سنعود قريباً إن شاء الله
      </p>

      <!-- Info Cards -->
      <div class="info-cards">
        <div class="info-card">
          <div class="info-card-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="info-card-text">
            <h3>متى سيعود الموقع؟</h3>
            <p>عادةً بضع دقائق فقط. سيعود تلقائياً فور اكتمال التحديث.</p>
          </div>
        </div>

        <div class="info-card">
          <div class="info-card-icon gold">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="info-card-text">
            <h3>بياناتك آمنة</h3>
            <p>جميع بياناتك وطلباتك محفوظة بأمان ولا تتأثر بالتحديث.</p>
          </div>
        </div>
      </div>

      <!-- Retry -->
      <div class="retry-area">
        <button id="retryBtn" class="btn-retry" onclick="handleRetry()">
          <svg id="retryIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
          <span id="retryText">حاول مرة أخرى</span>
        </button>
        <p id="countdownText" class="countdown"></p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>© متجر الجبل المتين — شكراً لصبركم</p>
    </div>
  </div>

  <script>
    // ============================================================
    // Auto-retry logic — checks origin every 15 seconds
    // ============================================================
    const ORIGIN = (() => {
      const params = new URLSearchParams(window.location.search);
      return params.get('origin') || 'https://matein3store.com';
    })();

    let countdown = 15;
    let retrying = false;
    let countdownTimer = null;

    startCountdown();

    function startCountdown() {
      clearInterval(countdownTimer);
      updateCountdownDisplay();
      countdownTimer = setInterval(() => {
        countdown--;
        updateCountdownDisplay();
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          handleRetry();
        }
      }, 1000);
    }

    function updateCountdownDisplay() {
      const el = document.getElementById('countdownText');
      if (countdown > 0 && !retrying) {
        el.textContent = '\u0645\u062d\u0627\u0648\u0644\u0629 \u062a\u0644\u0642\u0627\u0626\u064a\u0629 \u0628\u0639\u062f ' + countdown + ' \u062b\u0627\u0646\u064a\u0629';
      } else {
        el.textContent = '';
      }
    }

    async function handleRetry() {
      if (retrying) return;
      retrying = true;
      clearInterval(countdownTimer);

      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const text = document.getElementById('retryText');

      btn.disabled = true;
      icon.classList.add('spin');
      text.textContent = '\u062c\u0627\u0631\u064a \u0627\u0644\u062a\u062d\u0642\u0642...';
      document.getElementById('countdownText').textContent = '';

      try {
        const res = await fetch(ORIGIN, {
          method: 'HEAD',
          mode: 'no-cors',
          cache: 'no-store',
        });
        window.location.href = ORIGIN;
        return;
      } catch (e) {
        // Server still down
      }

      retrying = false;
      btn.disabled = false;
      icon.classList.remove('spin');
      text.textContent = '\u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649';
      countdown = 15;
      startCountdown();
    }
  </script>
</body>
</html>
